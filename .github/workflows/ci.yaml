name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-cache-${{ hashFiles('pubspec.lock') }}
      - uses: actions/cache@v4
        id: build-runner-cache
        with:
          path: |
            **/*.g.dart
            **/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
      - run: make get
      - run: make gen
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-cache-${{ hashFiles('pubspec.lock') }}
      - uses: actions/cache@v4
        id: build-runner-cache
        with:
          path: |
            **/*.g.dart
            **/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
      - run: make get
      - run: make gen
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
      - run: make cov

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-cache-${{ hashFiles('pubspec.lock') }}
      - uses: actions/cache@v4
        id: build-runner-cache
        with:
          path: |
            **/*.g.dart
            **/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
      - run: make get
      - run: make gen
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
      - run: flutter build web -t lib/main_dev.dart --dart-define-from-file=config/example.json

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-cache-${{ hashFiles('pubspec.lock') }}
      - uses: actions/cache@v4
        id: build-runner-cache
        with:
          path: |
            **/*.g.dart
            **/*.freezed.dart
          key: build-runner-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
      - run: make get
      - run: make gen
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
      - run: chromedriver --port=4444 &
      - run: sleep 5 && make integration
